name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build web project (Release)
        run: msbuild WebApplication1/WebApplication1.csproj /p:Configuration=Release /t:Build /nologo /v:minimal
